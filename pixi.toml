[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "morca"
version = "0.29.0"
description = "Orchestration for Mojo data pipelines: DAGs in Mojo, cron schedules, a web UI."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

# libpq is what postgres.mojo dlopens; the server (initdb, pg_ctl, psql) is
# for the tests, which start a throwaway one (scripts/with-postgres.sh).
[dependencies]
libpq = ">=16,<19"
postgresql = ">=16,<19"
# libsqlite is what sqlite-mojo dlopens for morca.sqlite_store; the sqlite3
# shell is for the tests that look into a run's file (tests/chaos.sh).
libsqlite = ">=3.45,<4"
sqlite = ">=3.45,<4"

# morca as mojoshelf tin morca-mojo: the `morca` package, built against the
# revisions mojoshelf published of what it imports.
[package]
name = "morca-mojo"
version = "0.29.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/morca"
name = "morca"
# The dependencies' .mojoc files, which their packages install there.
extra-args = ["-I", "$PREFIX/lib/mojo"]

# liblake (#454), the library morca.tables loads, beside the package's
# .mojoc in lib/: built from src/morca/_lake/liblake.mojo with line tables (-g1)
# for a CPU every machine of the platform has (an image's binaries are
# built for the same), named for the platform. pixi-build-mojo writes a
# bin to $PREFIX/bin/<name>, hence the `../lib/`. The line tables ship: in
# the .so on Linux, in the .dSYM `mojo build` writes beside it on macOS.

[package.build.target.linux-64.config.pkg]
path = "src/morca"
name = "morca"
extra-args = ["-I", "$PREFIX/lib/mojo"]

[[package.build.target.linux-64.config.bins]]
name = "../lib/liblake.so"
path = "src/morca/_lake/liblake.mojo"
extra-args = ["--emit", "shared-lib", "-g1", "--target-cpu", "x86-64-v3", "-I", "src", "-I", "$PREFIX/lib/mojo"]

[package.build.target.linux-aarch64.config.pkg]
path = "src/morca"
name = "morca"
extra-args = ["-I", "$PREFIX/lib/mojo"]

[[package.build.target.linux-aarch64.config.bins]]
name = "../lib/liblake.so"
path = "src/morca/_lake/liblake.mojo"
extra-args = ["--emit", "shared-lib", "-g1", "--target-cpu", "neoverse-n1", "-I", "src", "-I", "$PREFIX/lib/mojo"]

[package.build.target.osx-arm64.config.pkg]
path = "src/morca"
name = "morca"
extra-args = ["-I", "$PREFIX/lib/mojo"]

[[package.build.target.osx-arm64.config.bins]]
name = "../lib/liblake.dylib"
path = "src/morca/_lake/liblake.mojo"
extra-args = ["--emit", "shared-lib", "-g1", "--target-cpu", "apple-m1", "-I", "src", "-I", "$PREFIX/lib/mojo", "-Xlinker", "-install_name", "-Xlinker", "@rpath/liblake.dylib"]

[package.host-dependencies]
mojo-compiler = "==1.2.0"
dista-mojo = { git = "https://github.com/morca-dev/dista", rev = "e8065b3650b077b3c93054d4bdc07a0a591bdafa" }
k8s-mojo = { git = "https://github.com/magmalake/k8s.mojo", rev = "1aa5b087c06e41313f0f629509260062fdac661b" }
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo", rev = "813682073914eb65bb653eef1681325221cf410c" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "d2fc48903dc4c6d7c0a251a9efb1337e138c8908" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "40068c4f95ea659e9b78aa91ced45420b07e3e6e" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
flare_mlake = { git = "https://github.com/magmalake/flare_mlake", rev = "b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8" }
json_mlake = { git = "https://github.com/magmalake/json_mlake", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
# Exactly the compiler liblake was built with: the library and the program
# share Mojo's runtime (LIB-TINS.md §5, item 10).
mojo-compiler = "==1.2.0"
libpq = ">=16,<19"
libsqlite = ">=3.45,<4"
dista-mojo = { git = "https://github.com/morca-dev/dista", rev = "e8065b3650b077b3c93054d4bdc07a0a591bdafa" }
k8s-mojo = { git = "https://github.com/magmalake/k8s.mojo", rev = "1aa5b087c06e41313f0f629509260062fdac661b" }
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo", rev = "813682073914eb65bb653eef1681325221cf410c" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "d2fc48903dc4c6d7c0a251a9efb1337e138c8908" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "40068c4f95ea659e9b78aa91ced45420b07e3e6e" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
flare_mlake = { git = "https://github.com/magmalake/flare_mlake", rev = "b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8" }
json_mlake = { git = "https://github.com/magmalake/json_mlake", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }


[tasks]
test-steps = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_steps.mojo -o build/test-steps && ./build/test-steps" }
test-cron = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_cron.mojo -o build/test-cron && ./build/test-cron" }
test-warehouse = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_warehouse.mojo -o build/test-warehouse && ./build/test-warehouse" }
test-cli = { cmd = "tests/cli.sh" }
test-hetzner = { cmd = "tests/hetzner.sh && tests/hetzner-stacks.sh" }
test-compile-fail = { cmd = "tests/compile_fail.sh" }
# The executor over every store that needs no server (tests/store_suite.mojo),
# then over Postgres, with what only Postgres has.
test-store = { cmd = "scripts/mojo-build.sh -I src -I tests $DEP_INC tests/test_store.mojo -o build/test-store && ./build/test-store" }
# The Lean model of pinned reads (formal/Morca/Pins) against Ctx.pin over the
# memory and SQLite stores, on the event sequences in formal/difftest/pins.cases.
test-formal-pins = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_formal_pins.mojo -o build/test-formal-pins && ./build/test-formal-pins" }
test-state = { cmd = "scripts/mojo-build.sh -I src -I tests $DEP_INC tests/test_state.mojo -o build/test-state && scripts/with-postgres.sh ./build/test-state" }
# The Lean model of the schema floor (formal/Morca/Migrate) against
# migration_floor, schema_ahead and State.migrate, on formal/difftest/migrate.cases.
test-formal-migrate = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_formal_migrate.mojo -o build/test-formal-migrate && scripts/with-postgres.sh ./build/test-formal-migrate" }
# The Lean model of fencing (formal/Morca/Fence) against PgStore's claim, fence
# and beat_run, on the event sequences in formal/difftest/fence.cases.
test-formal-fence = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_formal_fence.mojo -o build/test-formal-fence && scripts/with-postgres.sh ./build/test-formal-fence" }
# A crash's stack dump: morca.crash's summary of one, then a run whose
# process aborts mid-step under the scheduler.
test-crash = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_crash.mojo -o build/test-crash && ./build/test-crash && scripts/with-postgres.sh tests/crash.sh" }
test-tasks = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_tasks.mojo -o build/test-tasks && ./build/test-tasks" }
test-logs = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_logs.mojo -o build/test-logs && ./build/test-logs && rm -f build/logs.db build/logs.db-wal build/logs.db-shm && MORCA_DATABASE_URL=sqlite:build/logs.db tests/logs.sh" }
test-scheduler = { cmd = "scripts/with-postgres.sh tests/scheduler.sh" }
test-chaos = { cmd = "scripts/with-postgres.sh tests/chaos.sh" }
# The same over a SQLite file (morca.sqlite_store), with no server.
test-chaos-sqlite = { cmd = "MORCA_DATABASE_URL=sqlite:build/chaos.db tests/chaos.sh" }
test-ui = { cmd = "scripts/with-postgres.sh tests/ui.sh" }
test-actions = { cmd = "scripts/with-postgres.sh tests/actions.sh" }
# The fleet page (morca.fleet): samples kept in Postgres, hosts, cost, charts.
test-fleet = { cmd = "scripts/with-postgres.sh tests/fleet.sh" }
test-system = { cmd = "scripts/with-postgres.sh tests/system.sh" }
test-ui-login = { cmd = "scripts/with-postgres.sh tests/ui_login.sh" }
# Stopping morca ui (morca.web.drain): SIGTERM finishes what's in flight.
test-ui-drain = { cmd = "scripts/with-postgres.sh tests/ui_drain.sh" }
# `morca login` and `--remote` (morca.remote, morca.tokens): tokens, URLs and
# the credentials file, then the command against morca ui over HTTP.
test-remote = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_remote.mojo -o build/test-remote && ./build/test-remote && scripts/with-postgres.sh tests/remote.sh" }
# The watchdog (morca.watchdog): each rule over made-up rows, then the scheduler
# pausing pipelines, against the stand-in EC2 for the launches.
test-notify = { cmd = "scripts/with-postgres.sh tests/notify.sh" }
test-watchdog = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_watchdog.mojo -o build/test-watchdog && ./build/test-watchdog && scripts/with-postgres.sh tests/watchdog.sh" }
test-pause = { cmd = "scripts/with-postgres.sh tests/pause.sh" }
test-older-binary = { cmd = "scripts/with-postgres.sh tests/older_binary.sh" }
# The ec2 runner against a stand-in EC2 API; needs python3.
test-versions = { cmd = "scripts/with-postgres.sh tests/versions.sh" }
test-new-code = { cmd = "scripts/with-postgres.sh tests/new_code.sh" }
test-calendar = { cmd = "scripts/with-postgres.sh tests/calendar.sh" }
test-manual-run = { cmd = "scripts/with-postgres.sh tests/manual_run.sh" }
test-dead-runs = { cmd = "scripts/with-postgres.sh tests/dead_runs.sh" }
test-adopt = { cmd = "scripts/with-postgres.sh tests/adopt.sh" }
test-overlap = { cmd = "scripts/with-postgres.sh tests/overlap.sh" }
# A long run sees morca.outdated() once a newer version leads (#397).
test-outdated = { cmd = "scripts/with-postgres.sh tests/outdated.sh" }
test-one-run-per-key = { cmd = "scripts/with-postgres.sh tests/one_run_per_key.sh" }
# Hourly partitions: */5 fires, hour backfills, the day-of-hours calendar.
test-hourly = { cmd = "scripts/with-postgres.sh tests/hourly.sh" }
# morca.toml (morca.toml, morca.config): the parser, what register reads from
# the file and records, config show and export, and the env on each runner.
test-toml = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_toml.mojo -o build/test-toml && ./build/test-toml" }
test-upgrade = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_upgrade.mojo -o build/test-upgrade && ./build/test-upgrade" }
test-config = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_config.mojo -o build/test-config && ./build/test-config && scripts/with-postgres.sh tests/config.sh" }
# Fills (morca.fill): a pipeline filling its range by itself, within limits.
test-fill = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_fill.mojo -o build/test-fill && ./build/test-fill && scripts/with-postgres.sh tests/fill.sh" }
test-fill-version = { cmd = "scripts/with-postgres.sh tests/fill_version.sh" }
# Fills on a worker pool (#177): two `morca worker`s fill a range within
# fill_max_runs, and a run whose worker is gone is queued again.
test-pool-fills = { cmd = "scripts/with-postgres.sh tests/pool_fills.sh" }
# No Postgres deadlock on orca.runs between ticks and bulk updates (#440).
test-run-locks = { cmd = "scripts/with-postgres.sh tests/run_locks.sh" }
test-source = { cmd = "scripts/mojo-build.sh -I src $DEP_INC -D MORCA_SOURCE=https://example.com/lake.git -D MORCA_COMMIT=1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a tests/test_source.mojo -o build/test-source && ./build/test-source" }
test-highlight = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_highlight.mojo -o build/test-highlight && ./build/test-highlight" }
# The step cards' data (morca.step_cards): signatures, docstrings, the JSON.
test-step-cards = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_step_cards.mojo -o build/test-step-cards && ./build/test-step-cards" }
test-graph = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_graph.mojo -o build/test-graph && ./build/test-graph" }
playground = { cmd = "scripts/playground.sh" }
test-locate = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_locate.mojo -o build/test-locate && ./build/test-locate" }
test-timeline = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_timeline.mojo -o build/test-timeline && ./build/test-timeline" }
test-ec2 = { cmd = "scripts/with-postgres.sh tests/ec2.sh" }
test-autoscale = { cmd = "scripts/with-postgres.sh tests/autoscale.sh" }
test-no-workers = { cmd = "scripts/with-postgres.sh tests/no_workers.sh" }
# The ec2 runner's warm pool: runs of one pipeline on the same instances.
test-pool = { cmd = "scripts/with-postgres.sh tests/pool.sh" }
# The pool autoscaler's Hetzner client against tests/fake_hcloud.py (#267).
test-hcloud = { cmd = "tests/hcloud.sh" }
# The pool autoscaler end to end against tests/fake_hcloud.py (#267).
test-pool-scale = { cmd = "scripts/with-postgres.sh tests/pool_scale.sh" }
# The same on EC2, against tests/fake_ec2.py (#267).
test-pool-scale-ec2 = { cmd = "scripts/with-postgres.sh tests/pool_scale_ec2.sh" }
# A deploy of another worker image drains and replaces the pool's machines (#356).
test-pool-image = { cmd = "scripts/with-postgres.sh tests/pool_image.sh" }
# One run over two workers of a pool, with a cluster token (#268).
test-run-cluster = { cmd = "scripts/with-postgres.sh tests/run_cluster.sh" }
test-secrets = { cmd = "scripts/with-postgres.sh tests/secrets.sh" }
# Placement (morca.control): runs on the scheduler's own host, within its
# limits, beside runs on the stand-in EC2.
# A worker's run's state over morca ui's API: its encoding (morca.http_store,
# orca.workers); tests/worker.sh (the data environment) runs the rest.
test-worker-api = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_worker.mojo -o build/test-worker-api && ./build/test-worker-api" }
test-placement = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_control.mojo -o build/test-control && ./build/test-control && scripts/with-postgres.sh tests/placement.sh" }
# What runs use (morca.usage): the meter's sharing out, then a step holding a
# known amount on the local runner, the control host and a remote worker.
test-resources = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_resources.mojo -o build/test-resources && ./build/test-resources" }
# Requests learned from the measured peaks (morca.recommend), shown only.
test-recommend = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_recommend.mojo -o build/test-recommend && ./build/test-recommend" }
test-grants = { cmd = "scripts/with-postgres.sh tests/grants.sh" }
test-priority = { cmd = "scripts/with-postgres.sh tests/priority.sh" }
# Admission by memory pressure (orca.pressure, morca.admission): PSI parsing
# and the hold's hysteresis, then runs waiting on a fixture PSI file.
test-pressure = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_pressure.mojo -o build/test-pressure && ./build/test-pressure && scripts/with-postgres.sh tests/pressure.sh" }
test-usage = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_usage.mojo -o build/test-usage && ./build/test-usage && scripts/with-postgres.sh tests/usage.sh" }
# Containment (morca.cgroup): the arithmetic, then on Linux a run killed for
# its memory and retried bigger (skipped, saying why, without cgroups); then a
# run at a lower nice with MORCA_CGROUPS=0 (tests/run_nice.sh, #229).
test-cgroups = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_cgroup.mojo -o build/test-cgroup && ./build/test-cgroup && scripts/with-postgres.sh tests/cgroups.sh && scripts/with-postgres.sh tests/run_nice.sh" }
test-aws = { cmd = "tests/aws.sh && tests/replace_control.sh" }
test-lost-workers = { cmd = "scripts/with-postgres.sh tests/lost_workers.sh" }
test-datasets = { cmd = "scripts/with-postgres.sh tests/datasets.sh" }
test-stop = { cmd = "scripts/with-postgres.sh tests/stop.sh" }
test-binary-timeouts = { cmd = "scripts/with-postgres.sh tests/binary_timeouts.sh" }
test-db-blip = { cmd = "scripts/with-postgres.sh tests/db_blip.sh" }
test-sense-errors = { cmd = "scripts/with-postgres.sh tests/sense_errors.sh" }
test-defer = { cmd = "scripts/with-postgres.sh tests/defer.sh" }
# The sampler (morca.sample): its parsing, then the binary on this machine.
test-sample = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_sample.mojo -o build/test-sample && ./build/test-sample && tests/sample.sh" }
# A run's machines on its page (morca.metrics): peaks, warnings and charts.
test-metrics = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_metrics.mojo -o build/test-metrics && ./build/test-metrics" }
# Needs docker, kind and kubectl; builds the image of deploy/Dockerfile.
test-kind = { cmd = "tests/kind.sh" }
# The binaries most tests share, built at once before the tests that copy
# them (scripts/build-shared.sh, scripts/mojo-build.sh).
build-shared = { cmd = "scripts/build-shared.sh" }
# CI runs these three parts on runners of their own; `test` is all of them.
# The executor, stores, crashes, what runs use and the data a run makes:
test-executor-core = { depends-on = ["build-shared", "test-sample", "test-steps", "test-cron", "test-warehouse", "test-cli", "test-hetzner", "test-compile-fail", "test-store", "test-formal-pins", "test-state", "test-formal-migrate", "test-formal-fence", "test-crash", "test-tasks", "test-logs", "test-usage", "test-resources", "test-recommend", "test-cgroups", "test-aws", "test-source", "test-highlight", "test-step-cards", "test-graph", "test-locate", "test-timeline", "test-datasets", "test-db-blip", "test-chaos", "test-chaos-sqlite"] }
# Workers, pools, placement and the clouds they run on:
test-executor-workers = { depends-on = ["build-shared", "test-ec2", "test-autoscale", "test-no-workers", "test-pool", "test-hcloud", "test-pool-scale", "test-pool-scale-ec2", "test-pool-image", "test-run-cluster", "test-secrets", "test-placement", "test-grants", "test-pressure", "test-lost-workers"] }
test-executor = { depends-on = ["test-executor-core", "test-executor-workers"] }
# The scheduler, the UI, and what a registration and its code control:
test-scheduler-ui = { depends-on = ["build-shared", "test-toml", "test-upgrade", "test-config", "test-fill", "test-fill-version", "test-priority", "test-pool-fills", "test-run-locks", "test-metrics", "test-scheduler", "test-ui", "test-fleet", "test-system", "test-actions", "test-calendar", "test-ui-login", "test-ui-drain", "test-remote", "test-worker-api", "test-pause", "test-older-binary", "test-watchdog", "test-notify", "test-versions", "test-manual-run", "test-new-code", "test-defer", "test-dead-runs", "test-adopt", "test-overlap", "test-outdated", "test-one-run-per-key", "test-hourly", "test-sense-errors", "test-stop", "test-binary-timeouts"] }
test = { depends-on = ["test-executor", "test-scheduler-ui"] }
toy = { cmd = "scripts/mojo-build.sh -I src $DEP_INC examples/toy.mojo -o build/toy" }
fanout = { cmd = "scripts/mojo-build.sh -I src $DEP_INC examples/fanout.mojo -o build/fanout" }
morca = { cmd = "scripts/mojo-build.sh -I src $DEP_INC bin/scheduler.mojo -o build/morca" }
daily = { cmd = "scripts/mojo-build.sh -I src $DEP_INC examples/daily.mojo -o build/daily" }

# Stable is the default: morca targets Mojo 1.2.0. dista and k8s compile from
# checkouts next to this one (CI lays them out at the revisions in its
# workflow), since they aren't on mojoshelf yet. dista's own dependencies
# are packages, pinned at the revisions dista pins.
[feature.stable.dependencies]
mojo-compiler = "==1.2.0"
# The full mojo package, for the llvm-symbolizer deploy/Dockerfile ships.
# flare_mlake and json_mlake brought it in until they shipped as .mojoc.
mojo = "==1.2.0"
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "40068c4f95ea659e9b78aa91ced45420b07e3e6e" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "d2fc48903dc4c6d7c0a251a9efb1337e138c8908" }
# dista writes actor checkpoints through objectstore.
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
# morca's state. Pinned at the revision mojoshelf published as
# postgres-mojo 0.3.2, and threads-mojo at the revision it pins: the
# heartbeat runs on a thread of its own.
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "f45e780a8de77278c140cee36904e46e93e0ca1c" }
# `morca ui` serves its pages with flare. Pinned at the revision mojoshelf
# published as flare_mlake 0.14.1, which pins threads at the revision above
# and json_mlake at 0.5.1's revision; both ship as .mojoc packages, and
# flare builds its own native shims.
flare_mlake = { git = "https://github.com/magmalake/flare_mlake", rev = "b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8" }
json_mlake = { git = "https://github.com/magmalake/json_mlake", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
# morca.sqlite_store. Pinned at the revision mojoshelf published as
# sqlite-mojo 0.3.5, which iceberg-mojo pins too (the data environment).
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }

[feature.stable.activation.env]
DEP_INC = "-I ../dista.mojo/src -I ../k8s.mojo/src"

# A precompiled package only loads in the compiler that built it, so the
# nightly compiles dista's dependencies, and flare and json, from checkouts
# too. flare's server loads its native shims (TLS, zlib) when it starts, even
# for plain HTTP, so the nightly builds them as flare's own environment does:
# from its activation scripts, against conda-forge's OpenSSL and zlib, with
# g++ on Linux and the system clang on macOS.
[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"
openssl = ">=3.0,<4"
zlib = ">=1.3.1,<2"
libdeflate = ">=1.22,<2"
# objectstore's native shim, which the checkout below doesn't build.
objectstore-shim = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc", subdirectory = "shim" }

[feature.nightly.target.linux-64.dependencies]
gxx = ">=13"
sysroot_linux-64 = ">=2.34"

[feature.nightly.target.linux-aarch64.dependencies]
gxx = ">=13"

[feature.nightly.activation]
scripts = ["../flare_mlake/flare/tls/ffi/build.sh", "../flare_mlake/flare/http/ffi/build.sh"]

[feature.nightly.activation.env]
DEP_INC = "-I ../dista.mojo/src -I ../k8s.mojo/src -I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src -I ../objectstore.mojo/src -I ../postgres.mojo/src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../flare_mlake -I ../json_mlake -I ../sqlite.mojo"

# `mojo-compiler` ships no formatter; the nightly `modular` package does.
# `mojo format` has no check mode, so format-check formats and then asserts
# the tree did not move.
[feature.fmt.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.fmt.tasks]
fmt = { cmd = "mojo format src tests examples fuzz bin" }
format-check = { cmd = "mojo format src tests examples fuzz bin && git diff --exit-code -- src tests examples fuzz bin" }

# The data environment adds morca.tables, which reads and commits Iceberg
# tables. iceberg, parquet and their siblings compile from checkouts next to
# this one, at the revisions iceberg-mojo 0.12.0 was published with, as in
# dista's data environment (CI lays them out); the FFI tins are packages as
# well, for the C shims they install.
[feature.data.dependencies]
mojo-compiler = "==1.2.0"
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ff66975c095f392695facc1b6dd56823dec914bc" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "76190bb31012cd2d2f6712c4e1724a66474215db" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "23cd6e54967d7e41573371507228ca5c958ca685" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "dcbf840d22e3deaf24c587d12d28570a9a882b7f" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "0d76aa7b672c85580f4d8c5de855772bc972d535" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "324b2bb61e2e80327654abecf70fd4b2defbc50d" }
# The morca binary, which tests/lineage.sh builds for `morca lineage` and
# `morca ui`, serves the UI with flare: the stable environment's pins.
flare_mlake = { git = "https://github.com/magmalake/flare_mlake", rev = "b2c5823dc0f9ef95906978a9bdfda1d1ce505fa8" }
json_mlake = { git = "https://github.com/magmalake/json_mlake", rev = "27c05c1c0c2881abfb33ce8eefae4d44d8b602a9" }
libcurl = ">=8,<9"
libsqlite = ">=3.45,<4"
libpq = ">=16,<19"
postgresql = ">=16,<19"

[feature.data.activation.env]
DEP_INC = "-I ../dista.mojo/src -I ../k8s.mojo/src -I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../deflate.mojo/src -I ../avro.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../sqlite.mojo -I ../postgres.mojo/src -I ../iceberg.mojo/src"

# morca.tables loads liblake (#454), which the tests build into build/
# (scripts/build-liblake.sh); LAKE_LIB names it, so a binary copied
# elsewhere finds it too.
[feature.data.target.osx-arm64.activation.env]
LAKE_LIB = "$PIXI_PROJECT_ROOT/build/liblake.dylib"

[feature.data.target.linux-64.activation.env]
LAKE_LIB = "$PIXI_PROJECT_ROOT/build/liblake.so"

[feature.data.target.linux-aarch64.activation.env]
LAKE_LIB = "$PIXI_PROJECT_ROOT/build/liblake.so"

[feature.data.tasks]
# morca, which most of these tests run, built once (scripts/mojo-build.sh).
build-shared = { cmd = "scripts/build-shared.sh morca", depends-on = ["build-liblake"] }
# liblake, which morca.tables loads (#454); every test below needs it.
build-liblake = { cmd = "scripts/build-liblake.sh" }
test-tables = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_tables.mojo -o build/test-tables && scripts/with-postgres.sh ./build/test-tables", depends-on = ["build-liblake"] }
# Data files written in dista tasks, committed once by the step (append_files).
test-append-files = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_append_files.mojo -o build/test-append-files && scripts/with-postgres.sh ./build/test-append-files", depends-on = ["build-liblake"] }
# Steps that replace their partitions (replaces=, replace_partitions): reruns,
# retries, runs racing over one partition, and stale removals.
test-replace = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_replace.mojo -o build/test-replace && scripts/with-postgres.sh ./build/test-replace", depends-on = ["build-liblake"] }
test-replace-concurrent = { cmd = "tests/replace_concurrent.sh", depends-on = ["build-liblake"] }
# The Lean model of a retried step (formal/) against morca.tables.append, on
# the event sequences in formal/difftest/retry.cases.
test-formal-retry = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_formal_retry.mojo -o build/test-formal-retry && ./build/test-formal-retry", depends-on = ["build-liblake"] }
# A run's commits told from those of another run with its number, by the
# run's token (#292).
test-run-token = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_run_token.mojo -o build/test-run-token && ./build/test-run-token", depends-on = ["build-liblake"] }
# liblake itself (#454): ABI and missing-library refusals, an iceberg error
# crossing to the step's log as it would compiled in, and its line tables.
test-lake = { cmd = "tests/lake.sh", depends-on = ["build-liblake"] }
# test-tables with liblake's code compiled in (-D MORCA_LAKE_SOURCE=1), the
# fallback: both builds must pass.
test-tables-source = { cmd = "scripts/mojo-build.sh -D MORCA_LAKE_SOURCE=1 -I src $DEP_INC tests/test_tables.mojo -o build/test-tables-source && scripts/with-postgres.sh ./build/test-tables-source" }
# morca.tables' BatchBuilder and column accessors, and a table outside any step.
test-lake-batch = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_lake_batch.mojo -o build/test-lake-batch && ./build/test-lake-batch", depends-on = ["build-liblake"] }
# The same with liblake's code compiled in, as test-tables-source.
test-lake-batch-source = { cmd = "scripts/mojo-build.sh -D MORCA_LAKE_SOURCE=1 -I src $DEP_INC tests/test_lake_batch.mojo -o build/test-lake-batch-source && ./build/test-lake-batch-source" }
test-chaos-tables = { cmd = "CHAOS_SRC=tests/chaos_tables.mojo CHAOS_CHECK=1 scripts/with-postgres.sh tests/chaos.sh", depends-on = ["build-liblake"] }
test-taxi = { cmd = "scripts/with-postgres.sh tests/taxi.sh", depends-on = ["build-liblake"] }
test-lineage = { cmd = "scripts/with-postgres.sh tests/lineage.sh", depends-on = ["build-liblake"] }
# A dataset's Data tab (#435): schema, partitions, rows, chart and download,
# read by morca_maintain data, and public = false.
test-dataview = { cmd = "scripts/with-postgres.sh tests/dataview.sh", depends-on = ["build-liblake"] }
test-commits = { cmd = "tests/concurrent_commits.sh", depends-on = ["build-liblake"] }
# Snapshot expiry: morca expire, morca_maintain and the scheduler's sweep.
test-expire = { cmd = "scripts/with-postgres.sh tests/expire.sh", depends-on = ["build-liblake"] }
test-sensors = { cmd = "scripts/with-postgres.sh tests/sensors.sh", depends-on = ["build-liblake"] }
# keys_per_run for sensors and fills (#240), over tests/sensors.
test-keys-per-run = { cmd = "scripts/with-postgres.sh tests/keys_per_run.sh", depends-on = ["build-liblake"] }
# A snapshot sensed while a run of its partition is live (#139).
test-sensed-behind-live = { cmd = "scripts/with-postgres.sh tests/sensed_behind_live.sh", depends-on = ["build-liblake"] }
# The same two over MinIO: the warehouse and logs in object storage.
test-lineage-s3 = { cmd = "MORCA_TEST_S3=1 scripts/with-minio.sh scripts/with-postgres.sh tests/lineage.sh", depends-on = ["build-liblake"] }
test-sensors-s3 = { cmd = "MORCA_TEST_S3=1 scripts/with-minio.sh scripts/with-postgres.sh tests/sensors.sh", depends-on = ["build-liblake"] }
# The sampler's lines uploaded to the bucket while it runs and when it ends.
test-sample-s3 = { cmd = "MORCA_TEST_S3=1 scripts/with-minio.sh tests/sample.sh", depends-on = ["build-liblake"] }
test-keyed = { cmd = "scripts/with-postgres.sh tests/keyed.sh", depends-on = ["build-liblake"] }
test-keyed-backfills = { cmd = "scripts/with-postgres.sh tests/keyed_backfills.sh", depends-on = ["build-liblake"] }
test-keyed-sensor = { cmd = "scripts/with-postgres.sh tests/keyed_sensor.sh", depends-on = ["build-liblake"] }
test-keyed-names = { cmd = "scripts/with-postgres.sh tests/keyed_names.sh", depends-on = ["build-liblake"] }
# Remote workers (morca.worker, orca.workers): morca ui, the scheduler and an
# `morca worker` with no database, committing to a local warehouse.
test-worker = { cmd = "scripts/with-postgres.sh tests/worker.sh", depends-on = ["build-liblake"] }
# CI runs these three groups on runners of their own; test-data is all three.
test-data-tables = { depends-on = ["build-shared", "test-tables", "test-tables-source", "test-lake", "test-lake-batch", "test-lake-batch-source", "test-append-files", "test-replace", "test-replace-concurrent", "test-formal-retry", "test-run-token", "test-chaos-tables", "test-lineage", "test-dataview", "test-commits", "test-expire", "test-taxi"] }
test-data-sensors = { depends-on = ["build-shared", "test-sensors", "test-keys-per-run", "test-sensed-behind-live", "test-lineage-s3", "test-sensors-s3", "test-sample-s3", "test-worker"] }
test-data-keyed = { depends-on = ["build-shared", "test-keyed", "test-keyed-backfills", "test-keyed-sensor", "test-keyed-names"] }
test-data = { depends-on = ["test-data-tables", "test-data-sensors", "test-data-keyed"] }
taxi = { cmd = "scripts/mojo-build.sh -I src -I examples/taxi $DEP_INC examples/taxi/taxi.mojo -o build/taxi", depends-on = ["build-liblake"] }

# Rust workers (docs/rust-workers.md): the morca-worker crate's tests, and
# examples/rust-worker, a worker and its proxy pipeline, over a local
# warehouse. Cargo is only needed to build a worker; a run loads the built
# library, so the runtime image doesn't carry it.
[feature.rust.dependencies]
rust = ">=1.85"

[feature.rust.tasks]
test-rust-worker = { cmd = "tests/rust_worker.sh", depends-on = ["build-liblake"] }
test-hindcast = { cmd = "tests/hindcast.sh", depends-on = ["build-liblake"] }

# MinIO for the tests over object storage (scripts/with-minio.sh). conda-forge
# builds it for these two platforms only.
[feature.data.target.osx-arm64.dependencies]
minio-server = ">=2025.10.15"

[feature.data.target.linux-64.dependencies]
minio-server = ">=2025.10.15"

# Fuzzing with mozz (packaged for magmalake as mozz_mlake), as dista does: one
# harness per parser or decoder under fuzz/, built with every bounds check
# on. See fuzz/harness.mojo for FUZZ_RUNS and FUZZ_REPLAY.
[feature.fuzz.dependencies]
mozz_mlake = { git = "https://github.com/magmalake/mozz_mlake.git", rev = "bd84a1f1e376912414a3ddcf0f4151ed65435a44" }

[feature.fuzz.tasks]
fuzz-months = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_months.mojo -o build/fuzz-months && ./build/fuzz-months" }
fuzz-inputs = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_inputs.mojo -o build/fuzz-inputs && ./build/fuzz-inputs" }
fuzz-days = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_days.mojo -o build/fuzz-days && ./build/fuzz-days" }
fuzz-cron = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_cron.mojo -o build/fuzz-cron && ./build/fuzz-cron" }
fuzz-tz = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_tz.mojo -o build/fuzz-tz && ./build/fuzz-tz" }
fuzz-json = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_json.mojo -o build/fuzz-json && ./build/fuzz-json" }
fuzz-summary = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_summary.mojo -o build/fuzz-summary && ./build/fuzz-summary" }
fuzz-metadata = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_metadata.mojo -o build/fuzz-metadata && ./build/fuzz-metadata" }
fuzz-names = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_names.mojo -o build/fuzz-names && ./build/fuzz-names" }
fuzz-toml = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src -I fuzz $DEP_INC fuzz/fuzz_toml.mojo -o build/fuzz-toml && ./build/fuzz-toml" }
fuzz = { depends-on = ["fuzz-months", "fuzz-days", "fuzz-cron", "fuzz-tz", "fuzz-inputs", "fuzz-json", "fuzz-summary", "fuzz-metadata", "fuzz-names", "fuzz-toml"] }

[environments]
default = ["stable"]
nightly = ["nightly"]
fuzz = ["stable", "fuzz"]
fmt = { features = ["fmt"], no-default-feature = true }
data = { features = ["data"], no-default-feature = true }
rust = { features = ["data", "rust"], no-default-feature = true }
