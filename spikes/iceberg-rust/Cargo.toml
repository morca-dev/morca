[package]
name = "iceberg-rust-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Spike (#520): iceberg-rust committing to and reading morca's tables, no Mojo."

[[bin]]
name = "rside"
path = "src/main.rs"

[dependencies]
iceberg = "=0.11.0"
iceberg-storage-opendal = { version = "=0.11.0", default-features = false, features = ["opendal-s3"] }
# iceberg 0.11.0 is built on arrow-rs 58; the arrow types a writer hands it
# must be the same major version.
arrow-array = "58.4"
arrow-schema = "58.4"
parquet = { version = "58.4", features = ["async"] }
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
async-trait = "0.1"
rand = "0.9"

[profile.release]
strip = true
