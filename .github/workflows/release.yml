# A GitHub release for each morca version, with the Hetzner deploy tooling
# (deploy/hetzner/package.sh, under the tools' own version) as its assets, so deploying needs no checkout
# of morca (#247), and its runtime image, morca-runtime:<version>: the
# image CI built, tested and pushed from the released commit's sources
# (the release PR's morca-runtime:inputs-<key>, else main's
# morca-runtime:<sha>; runtime-image.yml), tagged again, not rebuilt.
# `shelf release` merges a PR from
# release/morca-mojo-<version>: its merge commit is tagged v<version> and
# released. By hand (Actions > release > Run workflow, or `gh workflow run
# release.yml -f version=0.18.0 -f ref=<sha>`) for a version released
# before this workflow, at the commit given. With `-f dry-run=true` it
# changes nothing: it checks the version, packages the tools and finds the
# image to tag, and says what it would release and tag.
name: release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "The version, as in shelf.toml (0.18.0)"
        required: true
      ref:
        description: "The commit to tag v<version> and package"
        required: true
      dry-run:
        description: "Release and tag nothing: only say what would be"
        type: boolean
        default: false

# One release of a version at a time.
concurrency:
  group: release-${{ inputs.version || github.head_ref }}

jobs:
  release:
    # Release PRs are branches of this repository: a fork's PR gets a
    # read-only token, and isn't a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/morca-mojo-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      key: ${{ steps.version.outputs.key }}
      runtime: ${{ steps.version.outputs.runtime }}
    env:
      GH_TOKEN: ${{ github.token }}
      WANT_VERSION: ${{ inputs.version }}
      HEAD_REF: ${{ github.head_ref }}
      REF: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          # The tags, to check v<version>, and the default branch, for
          # package.sh at a commit from before it.
          fetch-depth: 0

      - name: The version and commit
        id: version
        run: |
          version=${WANT_VERSION:-${HEAD_REF#release/morca-mojo-}}
          version=${version#v}
          sha=$(git rev-parse HEAD)
          # The commit must be that version's: shelf.toml says which it is.
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' shelf.toml)
          [ "$have" = "$version" ] || { echo "::error::shelf.toml at $sha says $have, not $version"; exit 1; }
          if tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}"); then
            [ "$tagged" = "$sha" ] || { echo "::error::v$version is $tagged already, not $sha"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # A version from before the runtime image has none to tag.
          echo "runtime=$([ -f deploy/runtime.Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The key of what its runtime image is built from (#353): the
          # release PR's image has it. None at a commit from before the key.
          key=
          [ ! -f deploy/runtime/inputs.sh ] || key=$(sh deploy/runtime/inputs.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "v$version is $sha, its runtime image's key ${key:-(none)}"

      # Under the tools' own version (#461), deploy/hetzner/VERSION, which
      # moves only when deploy/hetzner changes: a release that changes
      # nothing there attaches the same morca-hetzner-<tools>.tar.gz as the
      # one before. Asset names are per release, so the same name on two
      # releases doesn't collide. A commit from before VERSION: the morca
      # version, as then.
      - name: The deploy tooling's tarball
        run: |
          # A commit from before package.sh: the default branch's packages it.
          [ -f deploy/hetzner/package.sh ] || git show "origin/$DEFAULT_BRANCH:deploy/hetzner/package.sh" > deploy/hetzner/package.sh
          tools=$VERSION
          [ ! -s deploy/hetzner/VERSION ] || tools=$(cat deploy/hetzner/VERSION)
          echo "TOOLS=$tools" >> "$GITHUB_ENV"
          sh deploy/hetzner/package.sh "$tools" "$RUNNER_TEMP/assets" "$VERSION"
          tar -tzvf "$RUNNER_TEMP/assets/morca-hetzner-$tools.tar.gz"

      # The notes: the version's section of CHANGELOG.md, and how to get the
      # scripts.
      - name: The release
        env:
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md)." > "$notes"
          cat >> "$notes" << EOF

          **Deploying on Hetzner** ([docs/hetzner.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/hetzner.md)), with no checkout of morca: the deploy tools are morca-hetzner $TOOLS. You need new ones only when deploy.sh says so, or the changelog names a change to them.

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/morca-hetzner-$TOOLS.tar.gz | tar -xz
          \`\`\`
          EOF
          set -- "$RUNNER_TEMP/assets/morca-hetzner-$TOOLS.tar.gz" "$RUNNER_TEMP/assets/morca-hetzner.tar.gz"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: would release v$VERSION at $SHA with $*, and these notes:"
            cat "$notes"
            exit 0
          fi
          # Run again (an upload that failed), the release gets the assets anew.
          # Otherwise gh makes the tag v<version> at the commit, and the release.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$@" --clobber
          else
            gh release create "v$VERSION" "$@" --target "$SHA" --title "morca-mojo $VERSION" --notes-file "$notes"
          fi

  # The version's runtime image, ghcr.io/morca-dev/morca-runtime:<version>,
  # which project images build FROM: an image CI built and tested from the
  # released commit's sources, tagged <version>. Nothing is built here, and
  # a commit with no image fails the job rather than getting one built.
  #
  # Which image (#353): the version is compiled into the image (`morca
  # version`, which `morca register` and a project's image build check), so
  # the image of the commit before the version bump won't do; the released
  # commit's own sources must be built. They are, before the release: the
  # release PR's CI pushes its image as morca-runtime:inputs-<key>, the key
  # of what the image is built from (deploy/runtime/inputs.sh), and the
  # merge commit has the same key, so this tags that image in seconds.
  #
  # Without it (the release PR's image job failed or was skipped, or main
  # moved under the PR in a way that changed the inputs) it falls back to
  # main's image of the merge commit, morca-runtime:<sha> (or its key),
  # which main's CI starts building with this workflow: the job waits for
  # it while that run is going, and fails once the run has finished without
  # it (its runtime image job failed: re-run it, then this job), or when
  # there's no such run (a commit CI on main never pushed an image for, such
  # as one from before it did).
  # Its own job, after the release: Re-run failed jobs runs only this.
  runtime-image:
    needs: release
    if: needs.release.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GHCR_IMAGE: ghcr.io/morca-dev/morca-runtime
      SHA: ${{ needs.release.outputs.sha }}
      KEY: ${{ needs.release.outputs.key }}
      VERSION: ${{ needs.release.outputs.version }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find, or wait for, the image of ${{ env.KEY || env.SHA }}
        run: |
          # The release PR's image (inputs-<key>), else main's (<sha>).
          have() {
            for t in $KEY $SHA; do
              if docker buildx imagetools inspect "$GHCR_IMAGE:$t" > /dev/null 2>&1; then
                echo "FROM=$GHCR_IMAGE:$t" >> "$GITHUB_ENV"
                echo "found $GHCR_IMAGE:$t"
                return 0
              fi
            done
            return 1
          }
          if have; then exit 0; fi
          # The CI run on main for the commit, once GitHub has started it.
          for _ in $(seq 1 10); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$SHA" \
              --json databaseId -q '.[0].databaseId // empty')
            if [ -n "$run" ] || have; then break; fi
            sleep 30
          done
          if [ -z "$run" ] && ! have; then
            echo "::error::no CI run on main for $SHA, and no $GHCR_IMAGE:${KEY:-$SHA}: is it a commit on main?"
            exit 1
          fi
          until have; do
            status=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status -q .status) || status=unknown
            if [ "$status" = completed ] && ! have; then
              echo "::error::CI run $run on main finished without pushing $GHCR_IMAGE:$SHA" \
                "(its runtime image jobs failed?): re-run them, then this job"
              exit 1
            fi
            echo "waiting for $GHCR_IMAGE:$SHA (CI run $run: $status)"
            sleep 60
          done
      - name: Tag it ${{ env.VERSION }}
        run: |
          # The version and the released commit as annotations on the
          # index, which only an OCI index takes: a Docker manifest list
          # (what `docker push` makes with the classic image store) is
          # tagged without them. A dry run prints the index it would push.
          dry=
          [ "$DRY_RUN" != true ] || dry=--dry-run
          docker buildx imagetools create $dry \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            -t "$GHCR_IMAGE:$VERSION" "$FROM" \
            || docker buildx imagetools create $dry -t "$GHCR_IMAGE:$VERSION" "$FROM"
          if [ -n "$dry" ]; then
            echo "dry run: would tag $FROM as $GHCR_IMAGE:$VERSION"
            exit 0
          fi
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION"
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" | grep -E 'Platform: +linux/(arm64|amd64)'
