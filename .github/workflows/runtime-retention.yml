# Prunes ghcr.io/morca-dev/morca-runtime's per-commit images (#353) with
# scripts/runtime-prune.sh: release tags and what their indexes list are
# kept forever, and so are the newest 20 versions and those of the last 30
# days; older <sha> and inputs-<key> images (and their -arm64 and -amd64)
# go. Weekly, and by hand (Actions > runtime image retention > Run
# workflow, or `gh workflow run runtime-retention.yml`).
#
# It deletes only when asked: by hand with `-f delete=true`, or on the
# schedule once the repository variable RUNTIME_PRUNE is `delete`. Until
# then every run is a dry run that lists what it would delete.
name: runtime image retention

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      delete:
        description: "Delete the versions it finds (otherwise only list them)"
        type: boolean
        default: false
      keep-days:
        description: "Keep every version updated in the last this many days"
        default: "30"

concurrency:
  group: runtime-retention

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_DAYS: ${{ inputs.keep-days || '30' }}
      DELETE: ${{ (github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.RUNTIME_PRUNE == 'delete') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prune${{ env.DELETE != 'true' && ' (dry run)' || '' }}
        run: |
          if [ "$DELETE" = true ]; then
            sh scripts/runtime-prune.sh --delete
          else
            sh scripts/runtime-prune.sh
          fi
