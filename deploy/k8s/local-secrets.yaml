# The Secrets morca.yaml, runs.yaml and postgres-backup.yaml refer to, with
# passwords for a local cluster (kind) only. Anywhere else, leave this file
# out and make them yourself, with passwords of your own, before applying
# the others:
#
#     pw=$(openssl rand -hex 16)
#     for ns in morca morca-runs; do kubectl create namespace $ns --dry-run=client -o yaml | kubectl apply -f -; done
#     kubectl -n morca create secret generic morca-db --from-literal=password=$pw \
#         --from-literal=url=postgresql://orca:$pw@postgres.morca.svc:5432/orca
#     kubectl -n morca-runs create secret generic morca-db \
#         --from-literal=url=postgresql://orca:$pw@postgres.morca.svc:5432/orca
#     for ns in morca morca-runs; do kubectl -n $ns create secret generic morca-s3 \
#         --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...; done
#
# Postgres takes the password only when it first makes its database, on an
# empty volume. The namespaces are here too, so this file applies in any
# order with the others (kubectl apply -f deploy/k8s/ applies it first).
apiVersion: v1
kind: Namespace
metadata:
  name: morca
---
apiVersion: v1
kind: Namespace
metadata:
  name: morca-runs
---
# Postgres's password, and the URL the scheduler, the UI and the backup use.
apiVersion: v1
kind: Secret
metadata:
  name: morca-db
  namespace: morca
stringData:
  password: morca-local
  url: postgresql://orca:morca-local@postgres.morca.svc:5432/orca
---
# The URL the runs' drivers use.
apiVersion: v1
kind: Secret
metadata:
  name: morca-db
  namespace: morca-runs
stringData:
  url: postgresql://orca:morca-local@postgres.morca.svc:5432/orca
---
# The S3 keys, for MinIO, the scheduler, the UI and the backup.
apiVersion: v1
kind: Secret
metadata:
  name: morca-s3
  namespace: morca
stringData:
  AWS_ACCESS_KEY_ID: morca-local
  AWS_SECRET_ACCESS_KEY: morca-local-s3-secret
---
# The same keys, which every run pod gets by reference (morca.kube,
# MORCA_RUN_S3_SECRET), so no Job or Pod holds them.
apiVersion: v1
kind: Secret
metadata:
  name: morca-s3
  namespace: morca-runs
stringData:
  AWS_ACCESS_KEY_ID: morca-local
  AWS_SECRET_ACCESS_KEY: morca-local-s3-secret
