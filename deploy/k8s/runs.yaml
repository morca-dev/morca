# Where runs' clusters go (K8S.md, morca.kube): the `morca-runs` namespace,
# what the scheduler may do there and nothing else, and a hard cap on what all
# run pods together can ask for. The Secrets its pods refer to are made apart
# from this file (local-secrets.yaml): morca-db, the database its drivers
# reach, and morca-s3, the S3 keys of the bucket every pod reaches by
# reference (morca.kube, MORCA_RUN_S3_SECRET), so no Job or Pod holds them.
apiVersion: v1
kind: Namespace
metadata:
  name: morca-runs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: morca-scheduler
  namespace: morca-runs
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [create, get, list, watch, delete]
  # The driver's, head's and workers' logs, kept under MORCA_LOGS before
  # the Job is deleted.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  # A run's secrets (morca.toml's `secrets`): a Secret per run, which its
  # pods refer to, read to mask its driver log and deleted with the run.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: morca-scheduler
  namespace: morca-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: morca-scheduler
subjects:
  - kind: ServiceAccount
    name: morca-scheduler
    namespace: morca
---
# If morca asks for more than this, the extra pods wait rather than run.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: morca-runs
  namespace: morca-runs
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    pods: "40"
